[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "p1"
version = "0.0.1"
description = "coronary heart disease prediction from Behavioral Risk Factor Surveillance System data"
authors = [
  { name = "Maciej Jalocha, Hampus Serneke, Florian Dejean" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "ipykernel>=7.4.0",
    "loguru",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["p1"]
include = ["pyproject.toml", "p1/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["p1"]
force-sort-within-sections = true

